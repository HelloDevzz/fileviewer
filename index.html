<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="dot"></div>
    <h1>📁 File Viewer</h1>
    <span class="status" id="status">กำลังเชื่อมต่อ...</span>
  </header>

  <main>
    <p class="file-count" id="fileCount">โหลดไฟล์...</p>
    <div class="files" id="fileList"></div>
  </main>

  <div class="preview-modal" id="modal">
    <div class="preview-box">
      <div class="preview-header">
        <span class="preview-title" id="modalTitle"></span>
        <button class="btn-copy" id="modalCopy">Copy</button>
        <button class="btn-close" id="modalClose">✕</button>
      </div>
      <div class="preview-content">
        <pre id="modalContent"></pre>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">คัดลอกแล้ว ✓</div>

  <script src="script.js"></script>
</body>
</html>
